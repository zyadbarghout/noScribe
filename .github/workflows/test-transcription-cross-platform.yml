name: Cross-Platform Transcription Tests

on:
  push:
    branches: [ main, feature/** ]
    paths:
      - 'noScribe.py'
      - 'whisper_mp_worker.py'
      - 'pyannote_mp_worker.py'
      - 'test_transcription.py'
      - 'simple_platform_test.py'
      - '.github/workflows/test-transcription-cross-platform.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-setup:
    name: Setup and Verify
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up test matrix
        id: set-matrix
        run: |
          matrix=$(cat <<'EOF'
          {
            "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
            "python-version": ["3.9", "3.12"],
            "model": ["fast", "precise"]
          }
          EOF
          )
          echo "matrix=$(echo $matrix | jq -c .)" >> $GITHUB_OUTPUT
      
      - name: Verify test audio exists
        run: |
          if [ ! -f "test_resources/test_audio.mp3" ]; then
            echo "ERROR: test_resources/test_audio.mp3 not found!"
            exit 1
          fi
          echo "[OK] Test audio found"
          ls -lh test_resources/test_audio.mp3

  test-matrix:
    name: Test ${{ matrix.os }} - Py${{ matrix.python-version }} - ${{ matrix.model }}
    needs: test-setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-setup.outputs.matrix) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg libsndfile1 libffi-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg libsndfile

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg -y --quiet

    - name: Determine platform and requirements file
      id: platform
      shell: python
      run: |
        import platform
        import os
        
        system = platform.system()
        machine = platform.machine()
        
        print(f"Platform: {system} {machine}")
        print(f"Python: {platform.python_version()}")
        
        if system == "Darwin":
          if machine == "arm64":
            req_file = "environments/requirements_macOS_arm64.txt"
          else:
            req_file = "environments/requirements_macOS_x86_64.txt"
        elif system == "Linux":
          req_file = "environments/requirements_linux.txt"
        elif system == "Windows":
          req_file = "environments/requirements_win_cpu.txt"
        else:
          req_file = "environments/requirements_linux.txt"
        
        print(f"Requirements file: {req_file}")
        
        with open(os.environ.get('GITHUB_ENV', '.env'), 'a') as f:
          f.write(f"REQ_FILE={req_file}\n")
          f.write(f"PLATFORM={system}\n")

    - name: Display platform info
      run: |
        echo "Platform: ${{ env.PLATFORM }}"
        echo "Requirements file: ${{ env.REQ_FILE }}"
        if [ -f "${{ env.REQ_FILE }}" ]; then
          echo "[OK] File exists"
          echo "Contents:"
          cat "${{ env.REQ_FILE }}"
        else
          echo "[X] File not found"
          exit 1
        fi
      shell: bash

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install dependencies from requirements file
      run: |
        echo "Installing from: ${{ env.REQ_FILE }}"
        python -m pip install -r "${{ env.REQ_FILE }}" --quiet

    - name: Verify dependencies
      shell: python
      run: |
        import sys
        
        print("Checking required packages...")
        packages = [
          ("faster_whisper", "faster-whisper"),
          ("torch", "torch"),
          ("pyannote", "pyannote.audio"),
          ("yaml", "PyYAML"),
        ]
        
        failed = []
        for import_name, display_name in packages:
          try:
            __import__(import_name)
            print(f"[OK] {display_name}")
          except ImportError as e:
            print(f"[X] {display_name}: {e}")
            failed.append(display_name)
        
        if failed:
          print(f"\nERROR: Missing packages: {', '.join(failed)}")
          sys.exit(1)

    - name: Check system dependencies
      run: |
        echo "Checking ffmpeg..."
        ffmpeg -version | head -1
        echo "[OK] ffmpeg available"

    - name: Verify models
      shell: python
      run: |
        from pathlib import Path
        import sys
        
        models_dir = Path("models")
        
        for model_type in ["fast", "precise"]:
          model_path = models_dir / model_type
          config_file = model_path / "config.json"
          model_file = model_path / "model.bin"
          
          if not config_file.exists():
            print(f"[X] {model_type} model: Missing config.json")
            sys.exit(1)
          
          if not model_file.exists():
            print(f"[X] {model_type} model: Missing model.bin")
            sys.exit(1)
          
          size_mb = model_file.stat().st_size / (1024 * 1024)
          print(f"[OK] {model_type} model ({size_mb:.1f} MB)")

    - name: Verify test audio
      shell: python
      run: |
        from pathlib import Path
        import sys
        
        audio_file = Path("test_resources/test_audio.mp3")
        
        if not audio_file.exists():
          print("[X] Test audio not found")
          sys.exit(1)
        
        size_mb = audio_file.stat().st_size / (1024 * 1024)
        print(f"[OK] Test audio found ({size_mb:.2f} MB)")

    - name: Run transcription test
      id: test
      timeout-minutes: 20
      run: |
        python test_transcription.py --audio test_resources/test_audio.mp3 --verbose

    - name: Parse and display results
      if: always()
      shell: python
      run: |
        import json
        import tempfile
        from pathlib import Path
        import sys
        
        # Find the latest results file
        temp_dir = Path(tempfile.gettempdir())
        results_files = list(temp_dir.glob("*/noscribe_tests/transcription_results.json"))
        
        if not results_files:
          print("ERROR: No test results found!")
          sys.exit(1)
        
        results_file = sorted(results_files, key=lambda x: x.stat().st_mtime, reverse=True)[0]
        
        with open(results_file, 'r') as f:
          results = json.load(f)
        
        print("\n" + "=" * 80)
        print("TRANSCRIPTION TEST RESULTS")
        print("=" * 80)
        
        all_passed = True
        
        for model_name, model_result in results.get("models", {}).items():
          if model_result:
            print(f"\n[OK] {model_name.upper()} Model: SUCCESS")
            print(f"  Language: {model_result.get('language', 'N/A')}")
            print(f"  Probability: {model_result.get('language_probability', 0):.1%}")
            print(f"  Duration: {model_result.get('duration', 0):.2f}s")
            print(f"  Load Time: {model_result.get('load_time_seconds', 0):.2f}s")
            print(f"  Transcription Time: {model_result.get('transcription_time_seconds', 0):.2f}s")
            print(f"  Segments: {model_result.get('segments_count', 0)}")
            
            if model_result.get("segments"):
              print(f"  Sample segments:")
              for seg in model_result["segments"][:2]:
                print(f"    [{seg['start']:.2f}s - {seg['end']:.2f}s] {seg['text']}")
          else:
            print(f"\n[X] {model_name.upper()} Model: FAILED")
            all_passed = False
        
        print("\n" + "=" * 80)
        
        if not all_passed:
          sys.exit(1)

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.model }}
        path: |
          test_resources/
        retention-days: 30

    - name: Comment on failure
      if: failure()
      shell: bash
      run: |
        echo "::error::Test failed for ${{ matrix.os }} - Python ${{ matrix.python-version }} - ${{ matrix.model }} model"

  test-summary:
    name: Test Summary
    needs: test-matrix
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Generate summary
      run: |
        echo "# Transcription Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Platforms**: Ubuntu Latest, macOS Latest, Windows Latest" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Versions**: 3.9, 3.12" >> $GITHUB_STEP_SUMMARY
        echo "- **Models**: fast, precise" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Combinations**: 12" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Results" >> $GITHUB_STEP_SUMMARY
        echo "Check the artifacts tab for detailed results including:" >> $GITHUB_STEP_SUMMARY
        echo "- Transcription outputs (JSON)" >> $GITHUB_STEP_SUMMARY
        echo "- HTML reports" >> $GITHUB_STEP_SUMMARY
        echo "- Performance metrics" >> $GITHUB_STEP_SUMMARY
        echo "- Language detection results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "If tests failed, check the job logs for:" >> $GITHUB_STEP_SUMMARY
        echo "1. Missing Python dependencies" >> $GITHUB_STEP_SUMMARY
        echo "2. System dependency issues (ffmpeg, etc.)" >> $GITHUB_STEP_SUMMARY
        echo "3. Model availability" >> $GITHUB_STEP_SUMMARY
        echo "4. Test audio presence" >> $GITHUB_STEP_SUMMARY

    - name: Report test status
      run: |
        artifacts_count=$(find . -name "results-*" -type d | wc -l)
        echo "Found $artifacts_count test result sets"
        if [ $artifacts_count -eq 12 ]; then
          echo "[OK] All 12 test combinations completed"
        else
          echo "[WARN] Only $artifacts_count/12 test combinations found (may still be running or some failed)"
        fi
