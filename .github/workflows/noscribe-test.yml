name: noScribe Transcription Test

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-transcription:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      # Install Python dependencies first (needed for model download)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper torch huggingface-hub pyyaml
      
      # Cache the tiny Whisper model
      - name: Cache Whisper tiny model
        id: cache-model
        uses: actions/cache@v3
        with:
          path: models/tiny-test
          key: whisper-tiny-en-${{ runner.os }}
      
      # Download model if not cached
      - name: Download tiny Whisper model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: python download_test_model.py
      
      # Install FFmpeg
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y
      
      # Verify test resources
      - name: Verify test audio exists
        run: python -c "import sys; from pathlib import Path; p = Path('test_resources/test_audio.mp3'); print(f'[OK] Test audio found: {p} ({p.stat().st_size / 1024:.1f} KB)') if p.exists() else sys.exit(1)"
      
      # Run the core test
      - name: Run noScribe transcription test
        run: python test_noscribe_core.py
      
      # Upload test results on failure
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            *.log
            test_*.log
          retention-days: 7
